<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tre-zones-title tre-zones-desc" font-family="Raleway, sans-serif">
  <title id="tre-zones-title">Functional zones inside a Trusted Research Environment</title>
  <desc id="tre-zones-desc">A Security Server gateway sits above three zones: the Research Analytics Zone, the Secure Data Zone, and the Query Management Zone.</desc>

  <defs>
    <marker id="arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto"
            markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#005095"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="698" height="398" fill="#ffffff"/>

  <!-- TRE boundary -->
  <rect x="20" y="20" width="660" height="360" rx="12" fill="#f7fafc" stroke="#005095" stroke-width="2"/>
  <text x="35" y="45" font-size="15" font-family="Montserrat, sans-serif" font-weight="600" fill="#005095">Trusted Research Environment (TRE)</text>

  <!-- Security Server -->
  <rect x="40" y="55" width="620" height="55" rx="8" fill="#fff3ea" stroke="#ed7225" stroke-width="2.25"/>
  <text x="350" y="78" text-anchor="middle" font-size="13" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Security Server (SS)</text>
  <text x="350" y="96" text-anchor="middle" font-size="10" fill="#4a4a4a">Gateway for federation traffic</text>

  <!-- RAZ -->
  <rect x="55" y="135" width="190" height="220" rx="8" fill="#ffffff" stroke="#005095" stroke-width="1.5"/>
  <text x="150" y="166" text-anchor="middle" font-size="16" font-family="Montserrat, sans-serif" font-weight="600" fill="#005095">RAZ</text>
  <text x="150" y="185" text-anchor="middle" font-size="10.5" fill="#040305">Research Analytics Zone</text>
  <line x1="70" y1="197" x2="230" y2="197" stroke="#d8d8d8" stroke-width="1"/>
  <text x="150" y="320" text-anchor="middle" font-size="10" fill="#4a4a4a">Project environments</text>
  <text x="150" y="344" text-anchor="middle" font-size="10" fill="#4a4a4a">PI is Output and Input Approver</text>

  <!-- SDZ -->
  <rect x="265" y="135" width="190" height="220" rx="8" fill="#ffffff" stroke="#005095" stroke-width="1.5"/>
  <text x="360" y="166" text-anchor="middle" font-size="16" font-family="Montserrat, sans-serif" font-weight="600" fill="#005095">SDZ</text>
  <text x="360" y="185" text-anchor="middle" font-size="10.5" fill="#040305">Secure Data Zone</text>
  <line x1="280" y1="197" x2="440" y2="197" stroke="#d8d8d8" stroke-width="1"/>
  <text x="360" y="320" text-anchor="middle" font-size="10" fill="#4a4a4a">Data curation and linkage</text>
  <text x="360" y="344" text-anchor="middle" font-size="10" fill="#4a4a4a">Data Manager, Output Approver only</text>

  <!-- QMZ -->
  <rect x="475" y="135" width="190" height="220" rx="8" fill="#ffffff" stroke="#005095" stroke-width="1.5"/>
  <text x="570" y="166" text-anchor="middle" font-size="16" font-family="Montserrat, sans-serif" font-weight="600" fill="#005095">QMZ</text>
  <text x="570" y="185" text-anchor="middle" font-size="10.5" fill="#040305">Query Management Zone</text>
  <line x1="490" y1="197" x2="650" y2="197" stroke="#d8d8d8" stroke-width="1"/>
  <text x="570" y="320" text-anchor="middle" font-size="10" fill="#4a4a4a">Remote TRE queries</text>
  <text x="570" y="344" text-anchor="middle" font-size="10" fill="#4a4a4a">Direct and indirect</text>

  <!-- Connectors: Security Server to Zones -->
  <line x1="150" y1="111.5" x2="150" y2="133.5" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="111.5" x2="360" y2="133.5" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="111.5" x2="570" y2="133.5" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
