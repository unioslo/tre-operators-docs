<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="authz-title authz-desc" font-family="Raleway, sans-serif">
  <title id="authz-title">Authorization flow</title>
  <desc id="authz-desc">Client applications call API gateways, which forward requests to the authorization engine acting as policy enforcement point; the engine checks the central IAM and token exchange service before allowing calls through to the core service APIs.</desc>

  <defs>
    <marker id="arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto"
            markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#005095"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="698" height="238" fill="#ffffff"/>

  <rect x="20" y="95" width="140" height="50" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.5"/>
  <text x="90" y="125" text-anchor="middle" font-size="11.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Client Applications</text>

  <rect x="200" y="95" width="150" height="50" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.5"/>
  <text x="275" y="117" text-anchor="middle" font-size="11" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">API Gateways</text>
  <text x="275" y="133" text-anchor="middle" font-size="9.5" fill="#4a4a4a">external, internal, restricted</text>

  <rect x="390" y="95" width="150" height="50" rx="8" fill="#fff3ea" stroke="#ed7225" stroke-width="2"/>
  <text x="465" y="117" text-anchor="middle" font-size="11" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Authorization Engine</text>
  <text x="465" y="133" text-anchor="middle" font-size="9.5" fill="#4a4a4a">(PEP)</text>

  <rect x="580" y="95" width="100" height="50" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.5"/>
  <text x="630" y="117" text-anchor="middle" font-size="10.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Core Service</text>
  <text x="630" y="133" text-anchor="middle" font-size="10.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">APIs</text>

  <rect x="390" y="20" width="150" height="45" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.5"/>
  <text x="465" y="47" text-anchor="middle" font-size="11.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Central IAM System</text>

  <rect x="390" y="170" width="150" height="50" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.5"/>
  <text x="465" y="192" text-anchor="middle" font-size="11" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Token Exchange</text>
  <text x="465" y="208" text-anchor="middle" font-size="11" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Service</text>

  <line x1="161.5" y1="120" x2="198.5" y2="120" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="351.5" y1="120" x2="388.5" y2="120" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="541.5" y1="120" x2="578.5" y2="120" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="465" y1="93.5" x2="465" y2="66.5" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="465" y1="146.5" x2="465" y2="168.5" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
