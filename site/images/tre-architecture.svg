<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tre-arch-title tre-arch-desc" font-family="Raleway, sans-serif">
  <title id="tre-arch-title">EOSC-ENTRUST Trusted Research Environment reference architecture</title>
  <desc id="tre-arch-desc">A Trusted Research Environment containing three functional zones (RAZ, SDZ, QMZ) behind a Security Server, alongside the other Federation Participants (Federation Services, Index Service, Software Service, Discovery Service, Job Submission Service).</desc>

  <defs>
    <marker id="arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto"
            markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#005095"/>
    </marker>
    <marker id="arrow-start"
            viewBox="0 0 10 10"
            refX="1"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto"
            markerUnits="strokeWidth">
      <path d="M 10 0 L 0 5 L 10 10 Z" fill="#005095"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="998" height="618" fill="#ffffff"/>

  <!-- Federation boundary -->
  <rect x="20" y="20" width="960" height="580" rx="14" fill="none" stroke="#005095" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="40" y="47" font-size="17" font-family="Montserrat, sans-serif" font-weight="600" fill="#005095">EOSC-ENTRUST Federation</text>

  <!-- Federation Participants group -->
  <rect x="50" y="80" width="250" height="480" rx="10" fill="#ffffff" stroke="#005095" stroke-width="1.5"/>
  <text x="65" y="103" font-size="13" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Federation Participants</text>

  <!-- Federation Services -->
  <rect x="65" y="120" width="220" height="78" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.25"/>
  <text x="175" y="150" text-anchor="middle" font-size="12.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Federation Services</text>
  <text x="175" y="172" text-anchor="middle" font-size="10" fill="#4a4a4a">Registry, trust, monitoring</text>

  <!-- Index Service -->
  <rect x="65" y="208" width="220" height="78" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.25"/>
  <text x="175" y="238" text-anchor="middle" font-size="12.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Index Service</text>
  <text x="175" y="260" text-anchor="middle" font-size="10" fill="#4a4a4a">Linkage spines</text>

  <!-- Software Service -->
  <rect x="65" y="296" width="220" height="78" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.25"/>
  <text x="175" y="326" text-anchor="middle" font-size="12.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Software Service</text>
  <text x="175" y="348" text-anchor="middle" font-size="10" fill="#4a4a4a">Software artifacts</text>

  <!-- Discovery Service -->
  <rect x="65" y="384" width="220" height="78" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.25"/>
  <text x="175" y="414" text-anchor="middle" font-size="12.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Discovery Service</text>
  <text x="175" y="436" text-anchor="middle" font-size="10" fill="#4a4a4a">Federation metadata</text>

  <!-- Job Submission Service -->
  <rect x="65" y="472" width="220" height="78" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.25"/>
  <text x="175" y="502" text-anchor="middle" font-size="12.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Job Submission Service</text>
  <text x="175" y="524" text-anchor="middle" font-size="10" fill="#4a4a4a">Job requests</text>

  <!-- TRE boundary -->
  <rect x="330" y="80" width="610" height="480" rx="10" fill="#f7fafc" stroke="#005095" stroke-width="1.5"/>
  <text x="345" y="103" font-size="14" font-family="Montserrat, sans-serif" font-weight="600" fill="#005095">Trusted Research Environment (TRE)</text>

  <!-- Security Server -->
  <rect x="350" y="120" width="570" height="55" rx="8" fill="#fff3ea" stroke="#ed7225" stroke-width="2.25"/>
  <text x="635" y="142" text-anchor="middle" font-size="13" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Security Server (SS)</text>
  <text x="635" y="160" text-anchor="middle" font-size="10" fill="#4a4a4a">Gateway for federation traffic</text>

  <!-- Connector: Security Server to Federation Participants -->
  <line x1="348.5" y1="147" x2="301.5" y2="147" stroke="#005095" stroke-width="2" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>

  <!-- Zones -->
  <!-- RAZ -->
  <rect x="350" y="200" width="180" height="330" rx="8" fill="#ffffff" stroke="#005095" stroke-width="1.5"/>
  <text x="440" y="228" text-anchor="middle" font-size="15" font-family="Montserrat, sans-serif" font-weight="600" fill="#005095">RAZ</text>
  <text x="440" y="246" text-anchor="middle" font-size="10.5" fill="#040305">Research Analytics Zone</text>
  <line x1="365" y1="258" x2="515" y2="258" stroke="#d8d8d8" stroke-width="1"/>
  <text x="440" y="390" text-anchor="middle" font-size="10" fill="#4a4a4a">Project environments</text>
  <text x="440" y="414" text-anchor="middle" font-size="10" fill="#4a4a4a">PI is Output and Input Approver</text>

  <!-- SDZ -->
  <rect x="545" y="200" width="180" height="330" rx="8" fill="#ffffff" stroke="#005095" stroke-width="1.5"/>
  <text x="635" y="228" text-anchor="middle" font-size="15" font-family="Montserrat, sans-serif" font-weight="600" fill="#005095">SDZ</text>
  <text x="635" y="246" text-anchor="middle" font-size="10.5" fill="#040305">Secure Data Zone</text>
  <line x1="560" y1="258" x2="710" y2="258" stroke="#d8d8d8" stroke-width="1"/>
  <text x="635" y="390" text-anchor="middle" font-size="10" fill="#4a4a4a">Data curation and linkage</text>
  <text x="635" y="414" text-anchor="middle" font-size="10" fill="#4a4a4a">Data Manager, Output Approver only</text>

  <!-- QMZ -->
  <rect x="740" y="200" width="180" height="330" rx="8" fill="#ffffff" stroke="#005095" stroke-width="1.5"/>
  <text x="830" y="228" text-anchor="middle" font-size="15" font-family="Montserrat, sans-serif" font-weight="600" fill="#005095">QMZ</text>
  <text x="830" y="246" text-anchor="middle" font-size="10.5" fill="#040305">Query Management Zone</text>
  <line x1="755" y1="258" x2="905" y2="258" stroke="#d8d8d8" stroke-width="1"/>
  <text x="830" y="390" text-anchor="middle" font-size="10" fill="#4a4a4a">Remote TRE queries</text>
  <text x="830" y="414" text-anchor="middle" font-size="10" fill="#4a4a4a">Direct and indirect</text>

  <!-- Connectors: Security Server to Zones -->
  <line x1="440" y1="176.5" x2="440" y2="198.5" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="635" y1="176.5" x2="635" y2="198.5" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="176.5" x2="830" y2="198.5" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
