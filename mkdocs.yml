site_name: TRE Operators Guide
site_description: Documentation for Trusted Research Environment (TRE) operators in the context of Federated EOSC-ENTRUST
site_author: EOSC-ENTRUST Team
copyright: ""
repo_url: https://github.com/unioslo/tre-operators-docs
# Default branch is main not master
edit_uri: ./edit/main/docs
use_directory_urls: true
theme:
  name: readthedocs
  logo: images/eosc-entrust_logo_neg.png
  features:
    - search.suggest
    - search.highlight
    - navigation.tabs

markdown_extensions:
  - pymdownx.superfences  # Required to render the MyST-like warning/note boxes nicely
  - pymdownx.tasklist

extra_css:
  - stylesheets/home.css

nav:
  - Home: index.md
  - "M1: TRE Architecture": fundamentals.md
  - "M2: Legal Agreement Templates": modules/legal/index.md
  - "M3: Blueprint Architecture": modules/architecture/index.md
  - "M4: Interface Definitions": modules/interfaces/index.md
  - "M5: Operating Procedures": modules/procedures/index.md
  - Appendices:
      - Terminology:
          - Glossary: appendices/glossary.md
          - Reference Dictionary: appendices/reference-terminology-dictionary.md
      - Resources:
          - Relevant Training Material: appendices/resources.md
      - Relevance Matrix: appendices/relevance-matrix.md
      - Copilot Acknowledgement: appendices/copilot-acknowledgement.md