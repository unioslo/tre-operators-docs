<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="interconnect-title interconnect-desc" font-family="Raleway, sans-serif">
  <title id="interconnect-title">Every TRE talks to other TREs only through its Security Server</title>
  <desc id="interconnect-desc">Two Trusted Research Environments. In the requesting TRE A, the analytics zone where the researcher works connects to the Security Server. In the data-holding TRE B, the query zone that runs approved jobs connects to its own Security Server. The two Security Servers exchange encrypted, project-tagged interface objects with one another, and each one connects separately to shared federation services providing MyAccessID, ELK and the registry for identity and audit.</desc>

  <defs>
    <marker id="arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto"
            markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#005095"/>
    </marker>
    <marker id="arrow-start"
            viewBox="0 0 10 10"
            refX="1"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto"
            markerUnits="strokeWidth">
      <path d="M 10 0 L 0 5 L 10 10 Z" fill="#005095"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="898" height="458" fill="#ffffff"/>

  <text x="25" y="32" font-size="15" font-family="Montserrat, sans-serif" font-weight="600" fill="#005095">Every TRE talks to other TREs only through its Security Server</text>

  <!-- TRE A, requesting -->
  <rect x="25" y="55" width="310" height="235" rx="10" fill="#f7fafc" stroke="#005095" stroke-width="1.5"/>
  <text x="180" y="81" text-anchor="middle" font-size="12.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#005095">TRE A, requesting</text>

  <rect x="45" y="95" width="270" height="62" rx="8" fill="#ffffff" stroke="#005095" stroke-width="1.5"/>
  <text x="180" y="121" text-anchor="middle" font-size="11.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Analytics zone</text>
  <text x="180" y="139" text-anchor="middle" font-size="10" fill="#4a4a4a">RAZ, researcher works here</text>

  <line x1="180" y1="186" x2="180" y2="159" stroke="#005095" stroke-width="2" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>

  <rect x="45" y="188" width="270" height="62" rx="8" fill="#fff3ea" stroke="#ed7225" stroke-width="2.25"/>
  <text x="180" y="214" text-anchor="middle" font-size="11.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Security Server</text>
  <text x="180" y="232" text-anchor="middle" font-size="10" fill="#4a4a4a">Gateway for all traffic</text>

  <!-- TRE B, data-holding -->
  <rect x="565" y="55" width="310" height="235" rx="10" fill="#f7fafc" stroke="#005095" stroke-width="1.5"/>
  <text x="720" y="81" text-anchor="middle" font-size="12.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#005095">TRE B, data-holding</text>

  <rect x="585" y="95" width="270" height="62" rx="8" fill="#ffffff" stroke="#005095" stroke-width="1.5"/>
  <text x="720" y="121" text-anchor="middle" font-size="11.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Query zone</text>
  <text x="720" y="139" text-anchor="middle" font-size="10" fill="#4a4a4a">QMZ, runs approved jobs</text>

  <line x1="720" y1="186" x2="720" y2="159" stroke="#005095" stroke-width="2" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>

  <rect x="585" y="188" width="270" height="62" rx="8" fill="#fff3ea" stroke="#ed7225" stroke-width="2.25"/>
  <text x="720" y="214" text-anchor="middle" font-size="11.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Security Server</text>
  <text x="720" y="232" text-anchor="middle" font-size="10" fill="#4a4a4a">Gateway for all traffic</text>

  <!-- Security Server to Security Server -->
  <text x="450" y="207" text-anchor="middle" font-size="10" fill="#4a4a4a">Interface objects</text>
  <line x1="336.5" y1="219" x2="563.5" y2="219" stroke="#005095" stroke-width="2" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
  <text x="450" y="242" text-anchor="middle" font-size="10" fill="#4a4a4a">Encrypted, project-tagged</text>

  <!-- Federation services -->
  <rect x="280" y="355" width="340" height="70" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.5"/>
  <text x="450" y="383" text-anchor="middle" font-size="12.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Federation services</text>
  <text x="450" y="403" text-anchor="middle" font-size="10" fill="#4a4a4a">MyAccessID, ELK, Registry</text>

  <path d="M180,291 L180,390 L278.5,390" fill="none" stroke="#b8c4ce" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="192" y="338" font-size="10" fill="#4a4a4a">Identity and audit</text>

  <path d="M720,291 L720,390 L621.5,390" fill="none" stroke="#b8c4ce" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="708" y="338" text-anchor="end" font-size="10" fill="#4a4a4a">Identity and audit</text>
</svg>
