<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="audit-title audit-desc" font-family="Raleway, sans-serif">
  <title id="audit-title">Auditing and operations flow</title>
  <desc id="audit-desc">The core service APIs publish events to a message broker, audit and event logging, and firewall and network segmentation, which together feed operational access control and isolated project VLANs.</desc>

  <defs>
    <marker id="arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto"
            markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#005095"/>
    </marker>
    <marker id="arrow-start"
            viewBox="0 0 10 10"
            refX="1"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto"
            markerUnits="strokeWidth">
      <path d="M 10 0 L 0 5 L 10 10 Z" fill="#005095"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="698" height="318" fill="#ffffff"/>

  <rect x="270" y="20" width="160" height="50" rx="8" fill="#fff3ea" stroke="#ed7225" stroke-width="2"/>
  <text x="350" y="50" text-anchor="middle" font-size="11.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Core Service APIs</text>

  <rect x="40" y="120" width="160" height="50" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.5"/>
  <text x="120" y="150" text-anchor="middle" font-size="11.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Message Broker</text>

  <rect x="270" y="120" width="160" height="50" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.5"/>
  <text x="350" y="142" text-anchor="middle" font-size="11" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Audit and Event</text>
  <text x="350" y="158" text-anchor="middle" font-size="11" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Logging</text>

  <rect x="500" y="120" width="160" height="50" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.5"/>
  <text x="580" y="142" text-anchor="middle" font-size="11" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Firewall and Network</text>
  <text x="580" y="158" text-anchor="middle" font-size="11" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Segmentation</text>

  <rect x="40" y="220" width="160" height="50" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.5"/>
  <text x="120" y="242" text-anchor="middle" font-size="11" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Directory Sync</text>
  <text x="120" y="258" text-anchor="middle" font-size="11" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Service</text>

  <rect x="270" y="220" width="160" height="50" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.5"/>
  <text x="350" y="242" text-anchor="middle" font-size="11" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Operational Access</text>
  <text x="350" y="258" text-anchor="middle" font-size="11" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Control</text>

  <rect x="500" y="220" width="160" height="50" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.5"/>
  <text x="580" y="242" text-anchor="middle" font-size="11" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Isolated Project</text>
  <text x="580" y="258" text-anchor="middle" font-size="11" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">VLANs</text>

  <path d="M300,71.5 L300,95 L120,95 L120,118.5" fill="none" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="71.5" x2="350" y2="118.5" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M400,71.5 L400,95 L580,95 L580,118.5" fill="none" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="120" y1="171.5" x2="120" y2="218.5" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="201.5" y1="245" x2="268.5" y2="245" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="171.5" x2="350" y2="218.5" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M520,171.5 L520,195 L410,195 L410,218.5" fill="none" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="171.5" x2="580" y2="218.5" stroke="#005095" stroke-width="2" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
</svg>
