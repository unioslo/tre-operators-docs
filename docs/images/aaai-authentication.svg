<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="auth-title auth-desc" font-family="Raleway, sans-serif">
  <title id="auth-title">Authentication flow</title>
  <desc id="auth-desc">Client applications and federated identity providers authenticate through the OIDC provider, which is backed by the central IAM system and issues tokens through the token exchange service.</desc>

  <defs>
    <marker id="arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto"
            markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#005095"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="698" height="298" fill="#ffffff"/>

  <rect x="260" y="20" width="180" height="50" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.5"/>
  <text x="350" y="50" text-anchor="middle" font-size="12.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Central IAM System</text>

  <rect x="260" y="110" width="180" height="50" rx="8" fill="#fff3ea" stroke="#ed7225" stroke-width="2" />
  <text x="350" y="140" text-anchor="middle" font-size="12.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">OIDC Provider</text>

  <rect x="40" y="110" width="160" height="50" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.5"/>
  <text x="120" y="140" text-anchor="middle" font-size="11.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Client Applications</text>

  <rect x="500" y="90" width="160" height="50" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.5"/>
  <text x="580" y="112" text-anchor="middle" font-size="11" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Federated Identity</text>
  <text x="580" y="128" text-anchor="middle" font-size="11" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Providers</text>

  <rect x="500" y="160" width="160" height="50" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.5"/>
  <text x="580" y="190" text-anchor="middle" font-size="11.5" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Multi-Factor Auth</text>

  <rect x="260" y="220" width="180" height="50" rx="8" fill="#f5f5f5" stroke="#005095" stroke-width="1.5"/>
  <text x="350" y="242" text-anchor="middle" font-size="11" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Token Exchange</text>
  <text x="350" y="258" text-anchor="middle" font-size="11" font-family="Montserrat, sans-serif" font-weight="600" fill="#040305">Service</text>

  <line x1="350" y1="71.5" x2="350" y2="108.5" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="201.5" y1="135" x2="258.5" y2="135" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M441.5,125 L470,125 L470,115 L498.5,115" fill="none" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M441.5,145 L470,145 L470,185 L498.5,185" fill="none" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="161.5" x2="350" y2="218.5" stroke="#005095" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
